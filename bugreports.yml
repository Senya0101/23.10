---
- summary: |
    кнопка закрытия (крестик) не закрывает модальное окно «Заказ успешно сформирован»
  environment: |
    Google Chrome
    ОС Windows 10
    https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. открыть главную страницу https://products-store.hexlet.app/
    2. добавить любой товар в корзину
    3. перейти в корзину
    4. нажать кнопку оформления заказа (Checkout)
    5. в появившемся модальном окне «Заказ успешно сформирован» нажать крестик
  expected-result: |
    модальное окно закрывается, пользователь возвращается к каталогу или корзине
  actual-result: |
    модальное окно не закрывается, крестик не реагирует на нажатие
    ошибка изображена на скриншоте assets/bug-l10n-products.png

- summary: |
    названия и описания товаров не переводятся при смене языка интерфейса
  environment: |
    Google Chrome
    ОС Windows 10
    https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. открыть главную страницу https://products-store.hexlet.app/ (язык по умолчанию — английский)
    2. переключить язык интерфейса на русский
    3. открыть карточку любого товара
  expected-result: |
    название и описание товара отображаются на выбранном языке (русском)
  actual-result: |
    интерфейс переведён на русский, но название и описание товара остаются на английском
    ошибка изображена на скриншоте assets/bug-spanish-lang.png

- summary: |
    в переключателе языков присутствует испанский, локализация на который не заявлена в требованиях
  environment: |
    Google Chrome
    ОС Windows 10
    https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. открыть главную страницу https://products-store.hexlet.app/
    2. открыть переключатель языка интерфейса
    3. выбрать испанский язык
  expected-result: |
    доступны только языки, заявленные в требованиях: русский и английский
  actual-result: |
    в списке присутствует испанский язык; интерфейс переводится на него, а названия и описания товаров остаются на английском
    ошибка изображена на скриншоте assets/bug-cross.png