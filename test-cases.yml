---
- summary: |
    проверка отображения каталога товаров с названием, рейтингом и ценами
  requirement: |
    пользователь должен просматривать товары и видеть название, рейтинг, цену со скидкой и без
  prerequisites: |
    открыта главная страница магазина
  test-data: |
    -
  steps:
    - открыть главную страницу
    - просмотреть карточки товаров
  expected-result: |
    в каждой карточке отображаются название, рейтинг, цена со скидкой и без скидки

- summary: |
    проверка поиска товара по ключевому слову
  requirement: |
    пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    открыта главная страница
  test-data: |
    поисковый запрос = "eggs"
  steps:
    - ввести запрос в поле поиска
    - нажать Enter / кнопку поиска
  expected-result: |
    в каталоге отображаются только товары, соответствующие запросу

- summary: |
    проверка фильтрации товаров по категории
  requirement: |
    пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    открыт каталог товаров
  test-data: |
    категория = "Lemon"
  steps:
    - выбрать категорию в фильтре
  expected-result: |
    в каталоге отображаются только товары выбранной категории

- summary: |
    проверка добавления товара в корзину из каталога
  requirement: |
    пользователь должен добавлять товары в корзину
  prerequisites: |
    открыт каталог товаров
  test-data: |
    -
  steps:
    - нажать кнопку "Add to cart" "в корзину" на карточке товара
    - Перейти в корзину
  expected-result: |
    Товар отображается в корзине, счётчик корзины увеличился на 1

- summary: |
    проверка удаления товара из корзины
  requirement: |
    пользователь должен иметь возможность удалять товар из корзины
  prerequisites: |
    в корзине есть минимум один товар
  test-data: |
    -
  steps:
    - открыть корзину
    - нажать кнопку удаления товара
  expected-result: |
    Товар исчезает из корзины, счётчик корзины уменьшается

- summary: |
    проверка оформления заказа с переходом на страницу оплаты
  requirement: |
    Пользователь должен иметь возможность оформить заказ нажав на кнопку "оформить заказ"
  prerequisites: |
    В корзине есть товары
  test-data: |
    -
  steps:
    - открыть корзину
    - нажать "оформитьь заказ"
  expected-result: |
    происходит переход на страницу оплаты

- summary: |
    проверка переключения языка интерфейса на английский
  requirement: |
    пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    открыта главная страница
  test-data: |
    язык: русский
  steps:
    - переключить язык на английский
  expected-result: |
    элементы интерфейса отображаются на русскои языке

- summary: |
    проверка постраничного вывода товаров в каталоге
  requirement: |
    в каталоге должен быть постраничный вывод товаров
  prerequisites: |
    открыт каталог с количеством товаров больше одной страницы
  test-data: |
    -
  steps:
    - долистать каталог до конца
    - нажать следующую страницу
  expected-result: |
    отображается следующая порция товаров